<style>
:root {
  --bg: #ffffff; --soft: #f6f8f9; --ink: #16212a; --muted: #66757f; --line: #e5eaed;
  --accent: #0e7c66; --accent-soft: #e6f4f0; --ok: #1f9d55; --danger: #c4314b; --danger-soft: #fdecef; --warn: #b4580b;

}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: #fff; color: var(--ink); font-family: var(--font); line-height: 1.5; }
body { padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
.wrap { max-width: 520px; margin: 0 auto; }

.done-msg { color: var(--ok); font-weight: 700; margin: 10px 0 0; }
.t { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.t:first-of-type { border-top: 0; }

<script>
const SKEY = 'bog_s', CKEY = 'bog_v';   // 로그인 정보 · 마지막으로 본 화면(빠르게 열기용)
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 저장 못 해도 지금은 동작해요 */ } }, del(k) { try { localStorage.removeItem(k); } catch (e) { /* 무시 */ } } };
const cleanTok = s => String(s || '').replace(/[^A-Za-z0-9._-]/g, '');
let TOKEN = (() => { let k = ''; try { k = new URLSearchParams(location.search).get('k') || ''; } catch (e) { k = ''; }
  k = cleanTok(k); if (k) { ls.set(SKEY, k); try { history.replaceState(null, '', location.pathname); } catch (e) { /* 무시 */ } } else k = cleanTok(ls.get(SKEY));
  return k; })();
const API = String(window.BOG_API || '');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const kstToday = () => new Date(Date.now() + 9 * 36e5).toISOString().slice(0, 10);
const DOWN = ['일', '월', '화', '수', '목', '금', '토'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wdOf = iso => new Date(iso + 'T00:00:00Z').getUTCDay();
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const mondayOf = iso => addDays(iso, -((wdOf(iso) + 6) % 7));
const mdn = iso => (+iso.slice(5, 7)) + '/' + (+iso.slice(8, 10));
const $ = id => document.getElementById(id);

let S = null, logs = new Set(), part = {}, weekStart = null, err = '', loading = true, q = Promise.resolve(), toastT = null, pending = 0;
let lg = { no: ls.get('bog_no') || '', pw: '', busy: false, msg: '', show: false }, outAsk = false, rv = null;
let dd = null, saved = null, sending = false; const openHow = new Set();        // dd: 입력 중인 값, saved: 이미 보낸 값
const KEYS = [['sleep', '수면의 질', '못 잤어요', '푹 잤어요'], ['fatigue', '근육 피로도', '가뿐해요', '많이 지쳤어요'], ['stress', '스트레스', '편안해요', '많이 받아요']];

async function capi(req) {
  if (!API) throw new Error('NO_API');
  if (req.op !== 'login') { const tk = req.token || TOKEN; if (!tk) throw new Error('BAD_TOKEN'); req.token = tk; }
  let r; const ac = typeof AbortController === 'function' ? new AbortController() : null, tm = ac ? setTimeout(() => ac.abort(), 25000) : 0;
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), redirect: 'follow', signal: ac ? ac.signal : undefined });
    r = await res.json();
  } catch (e) { throw new Error('NO_SERVER'); } finally { if (tm) clearTimeout(tm); }
  if (r && r.ok) return r;
  throw new Error((r && r.error) || 'ERR');

  return `<div class="card"><h2>내 정보</h2><p class="hint" style="margin:0 0 4px">${no ? '회원번호 <b>' + esc(no) + '</b> · ' : ''}${esc(S.name)}님으로 로그인되어 있어요.</p>
    ${outAsk ? `<p class="hint" style="margin:8px 0 0">로그아웃하면 다시 들어올 때 회원번호와 비밀번호가 필요해요.</p><div class="bt2"><button class="btn primary" data-out="yes" style="background:var(--danger);border-color:var(--danger)">로그아웃</button><button class="btn" data-out="no" style="margin-top:12px">취소</button></div>` : '<button class="btn" data-out="ask" style="width:100%;margin-top:10px">로그아웃</button>'}</div>`;
}

/* ── 알림(앱 푸시): 코치님이 오늘의 과제를 보내면 폰 알림으로 받아요 ── */
const IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const PUSHST = { sup: ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window), on: false, known: false, busy: false, msg: '', synced: '' };
function keyBytes(b64u) { const p = String(b64u || '').replace(/-/g, '+').replace(/_/g, '/'), raw = atob(p + '===='.slice(p.length % 4 || 4)), o = new Uint8Array(raw.length); for (let i = 0; i < raw.length; i++) o[i] = raw.charCodeAt(i); return o; }
function keyIs(sub, b64u) { try { const a = new Uint8Array(sub.options.applicationServerKey), b = keyBytes(b64u); return a.length === b.length && a.every((v, i) => v === b[i]); } catch (e) { return true; } }
async function pushSync() {
  if (!PUSHST.sup || !S || !S.push || !S.push.on || TOKEN.indexOf('s1.') !== 0) return;
  try {
    const reg = await navigator.serviceWorker.ready; let sub = await reg.pushManager.getSubscription(), on = !!sub && Notification.permission === 'granted';
    if (on && !keyIs(sub, S.push.key)) { await sub.unsubscribe(); on = false; }                     // 서버 키가 바뀌었으면 다시 켜야 해요
    if (on && PUSHST.synced !== TOKEN) { await capi({ op: 'psub', endpoint: sub.endpoint }); PUSHST.synced = TOKEN; }   // 서버 등록 확인(같으면 아무것도 쓰지 않아요)
    if (on !== PUSHST.on || !PUSHST.known) { PUSHST.on = on; PUSHST.known = true; render(); }
  } catch (e) { if (!PUSHST.known) { PUSHST.known = true; render(); } }
}
async function pushEnable() {
  if (PUSHST.busy || !PUSHST.sup || !S || !S.push) return;
  PUSHST.busy = true; PUSHST.msg = ''; render();
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') PUSHST.msg = perm === 'denied' ? '알림이 막혀 있어요. 폰 설정에서 이 앱의 알림을 허용한 뒤 다시 눌러 주세요.' : '알림을 허용해야 받을 수 있어요.';
    else {
      const reg = await navigator.serviceWorker.ready; let sub = await reg.pushManager.getSubscription();
      if (sub && !keyIs(sub, S.push.key)) { await sub.unsubscribe(); sub = null; }
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(S.push.key) });
      await capi({ op: 'psub', endpoint: sub.endpoint }); PUSHST.synced = TOKEN; PUSHST.on = true; toast('알림을 켰어요');
    }
  } catch (e) { PUSHST.msg = e && e.message === 'BAD_TOKEN' ? '로그인이 끝났어요. 다시 로그인해 주세요.' : '알림을 켜지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.'; }
  PUSHST.busy = false; render();
}
async function pushDisable() {
  if (PUSHST.busy) return; PUSHST.busy = true; render();
  try { const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); if (sub) { const ep = sub.endpoint; await sub.unsubscribe(); try { await capi({ op: 'punsub', endpoint: ep }); } catch (e) { /* 서버에서는 다음 발송 때 정리돼요 */ } } PUSHST.on = false; PUSHST.synced = ''; toast('알림을 껐어요'); }
  catch (e) { PUSHST.msg = '알림을 끄지 못했어요. 다시 눌러 주세요.'; }
  PUSHST.busy = false; render();
}
// 로그아웃·로그인 종료 때: 이 폰의 알림 등록을 지워요 (다른 사람이 같은 폰으로 로그인해도 알림이 섞이지 않게)
async function pushLeave(tk) {
  if (!PUSHST.sup) return;
  try { const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); PUSHST.on = false; PUSHST.known = false; PUSHST.synced = ''; if (!sub) return; const ep = sub.endpoint; await sub.unsubscribe(); if (tk) capi({ op: 'punsub', endpoint: ep, token: tk }).catch(() => {}); } catch (e) { /* 무시 */ }
}
function pushCard() {
  if (!S || !S.push || !S.push.on || TOKEN.indexOf('s1.') !== 0) return '';
  const standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  let inner;
  if (!PUSHST.sup) inner = IOS && !standalone ? '<p class="hint" style="margin:0">아이폰은 <b>홈 화면에 추가한 앱</b>에서만 알림을 켤 수 있어요. 홈 화면에 추가한 뒤, 그 아이콘으로 앱을 열어서 켜 주세요.</p>' : '<p class="hint" style="margin:0">이 브라우저에서는 알림을 쓸 수 없어요.</p>';
  else if (!PUSHST.known) return '';
  else if (PUSHST.on) inner = '<p class="hint" style="margin:0 0 10px">알림이 켜져 있어요. 코치님이 오늘의 과제를 보내면 알림으로 알려드려요.</p><button class="btn" data-push="off"' + (PUSHST.busy ? ' disabled' : '') + '>알림 끄기</button>';
  else inner = '<p class="hint" style="margin:0 0 10px">코치님이 보내는 오늘의 과제를 폰 알림으로 받을 수 있어요.</p><button class="btn primary" data-push="on"' + (PUSHST.busy ? ' disabled' : '') + '>' + (PUSHST.busy ? '켜는 중…' : '알림 받기') + '</button>';
  return '<div class="card"><h2>알림</h2>' + inner + (PUSHST.msg ? '<div class="err" role="alert" style="margin:10px 0 0">' + esc(PUSHST.msg) + '</div>' : '') + '</div>';
}
function render() {
  const app = $('app');
  if (!TOKEN) { app.innerHTML = loginView(); return; }
  if (loading && !S) { app.innerHTML = '<div class="center">불러오는 중이에요…</div>'; return; }
  if (!S) { app.innerHTML = `<h1>바디오프짐</h1><div class="err" role="alert">${esc(err || '불러오지 못했어요.').replace(/\n/g, '<br>')}<br><button class="btn" data-reload="1">다시 불러오기</button></div>`; return; }
  const td = S.today, ts = ordered().filter(t => sched(t, td)), k = ts.filter(t => nOf(t, td) >= setsOf(t)).length;
  const sTot = ts.reduce((a, t) => a + setsOf(t), 0), sDone = ts.reduce((a, t) => a + nOf(t, td), 0);
  const dow = DOWN[wdOf(td)], days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(weekStart, i));
  const thisWeek = weekStart === mondayOf(td);
  let h = `<h1>${esc(S.name)}님, 안녕하세요</h1><p class="sub">${mdn(td)} (${dow}) · ${ts.length ? `오늘 과제 <b>${k}</b> / ${ts.length} 완료${sTot > ts.length ? ` · 세트 ${sDone}/${sTot}` : ''}` : '오늘은 쉬는 날이에요'}</p>`;
  if (err) h += `<div class="err" role="alert">${esc(err)}<br><button class="btn" data-reload="1">다시 불러오기</button></div>`;
  h += installToggle();
  h += replyCard();
  h += noteCard();
  if (ts.length) h += `<div class="card"><h2>오늘 과제</h2>${ts.map(t => { const S0 = setsOf(t), n = nOf(t, td);
    return `<div class="tt"><div class="nm"><span>${esc(t.name)}</span>${S0 > 1 ? `<small class="${n >= S0 ? 'ok' : ''}">${n}/${S0}세트</small>` : `<small class="${n >= 1 ? 'ok' : ''}">${n >= 1 ? '완료' : ''}</small>`}</div>
      ${(S0 > 1 || t.dose) ? `<div class="ds">${esc([S0 > 1 ? S0 + '세트' : '', t.dose || ''].filter(Boolean).join(' × '))}</div>` : ''}<div class="sets" style="--n:${S0 > 1 ? S0 : 1}">${S0 > 1 ? Array.from({ length: S0 }, (_, i) => `<button data-sn="${i + 1}" data-t2="${esc(t.id)}" class="${i + 1 <= n ? 'on' : ''}" aria-pressed="${i + 1 <= n}" aria-label="${esc(t.name)} ${i + 1}세트">${i + 1}세트${i + 1 <= n ? ' ✓' : ''}</button>`).join('') : `<button data-sn="${n >= 1 ? 0 : 1}" data-t2="${esc(t.id)}" class="${n >= 1 ? 'on' : ''}" aria-pressed="${n >= 1}" aria-label="${esc(t.name)} 완료">${n >= 1 ? '했어요 ✓' : '했어요'}</button>`}</div>${howToggle(t)}</div>`; }).join('')}<p class="hint">끝낸 세트를 눌러 체크하세요. 체크한 세트를 다시 누르면 그 세트부터 해제돼요.</p></div>`;
  const howTs = ordered().filter(t => hasHow(t) && !sched(t, td) && days.some(d => sched(t, d)));
  const how = howTs.length ? '<div class="how"><p class="qn" style="margin:14px 0 2px">이번 주 다른 날 과제 하는 방법</p>' + howTs.map(t => `<details class="hwt" data-how="${esc(t.id)}"${openHow.has(t.id) ? ' open' : ''}><summary>${esc(t.name)}${t.video ? ' <span class="vtag">영상</span>' : ''}</summary>${howBody(t)}</details>`).join('') + '</div>' : '';
  h += `<div class="card"><div class="nav"><h2 style="margin:0 6px 0 0">이번 주 기록</h2><button data-wk="-1" aria-label="지난주">‹</button><b>${mdn(days[0])} ~ ${mdn(days[6])}</b><button data-wk="1" aria-label="다음주">›</button>${thisWeek ? '<span class="tag">이번 주</span>' : '<button class="now" data-wk="0">이번 주</button>'}</div><div class="wkwrap">${weekGrid(weekStart)}</div><p class="hint">✓ 한 날 · ✕ 못한 날 · 주황 원(2/3)은 세트를 일부만 한 날 · 점선 원은 오늘이에요. 오늘부터 이틀 전까지는 칸을 눌러 체크할 수 있어요 (세트가 여러 개면 누를 때마다 하나씩 늘어요).</p>${how}</div>`;
  h += runCard();
  h += trainCard();
  h += reportCard();
  h += dailyForm();
  h += painForm();
  h += pushCard();
  h += meCard();
  app.innerHTML = h;
}

document.addEventListener('toggle', e => { const d = e.target; if (d && d.dataset && d.dataset.how) { d.open ? openHow.add(d.dataset.how) : openHow.delete(d.dataset.how); } }, true);
document.addEventListener('input', e => { if (e.target.id === 'lgNo') lg.no = e.target.value; if (e.target.id === 'lgPw') lg.pw = e.target.value; if (e.target.id === 'lgNo' || e.target.id === 'lgPw') return; if (e.target.id === 'memo' && dd) { dd.memo = e.target.value; const s = $('send'); if (s) s.disabled = !canSend(); } });
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.pr !== undefined && pd) { const it = pd.items[+t.dataset.pr]; if (it) { pd.touched = true; it.r = t.value; render(); } } });
document.addEventListener('submit', e => { if (e.target.id === 'lgf') { e.preventDefault(); doLogin(); } });
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lgshow) { lg.show = !lg.show; render(); const p = $('lgPw'); if (p) { p.focus(); try { p.setSelectionRange(p.value.length, p.value.length); } catch (x) { /* 무시 */ } } return; }
  if (b.dataset.rep) { const r = ((S && S.reports) || []).find(x => x.id === b.dataset.rep); openReport(b.dataset.rep, r ? r.title : ''); return; }
  if (b.dataset.rvclose) { closeRv(); return; }
  if (b.dataset.push) { if (b.dataset.push === 'on') pushEnable(); else pushDisable(); return; }
  if (b.dataset.out) { if (b.dataset.out === 'yes') doLogout(); else { outAsk = b.dataset.out === 'ask'; render(); } return; }
  if (b.dataset.s) { const v = +b.dataset.v; dd[b.dataset.s] = dd[b.dataset.s] === v ? null : v; render(); return; }
  if (b.dataset.itab) { instTab = b.dataset.itab; instOpen = true; render(); return; }
  if (b.dataset.inst === 'copy') { copyText(realUrl()).then(ok => toast(ok ? '링크를 복사했어요. 사파리나 크롬 주소창에 붙여넣어 주세요' : '복사하지 못했어요. 링크를 길게 눌러 복사해 주세요')); return; }
  if (b.dataset.inst === 'go') { if (instEvt) { const ev = instEvt; instEvt = null; ev.prompt(); ev.userChoice.finally(() => render()); } return; }
  if (b.id === 'send') { send(); return; }
  if (b.id === 'psend') { psend(); return; }
  if (b.dataset.pn !== undefined) { const on = b.dataset.pn === '1'; pd.touched = true; pd.none = on ? false : true; if (on && !pd.items.length) pd.items = [{ r: '', v: null }]; render(); return; }
  if (b.dataset.pv !== undefined) { const it = pd.items[+b.dataset.pv], v = +b.dataset.v; if (it) { pd.touched = true; it.v = it.v === v ? null : v; render(); } return; }
  if (b.dataset.padd) { pd.touched = true; pd.items.push({ r: '', v: null }); render(); return; }
  if (b.dataset.pdel !== undefined) { pd.touched = true; pd.items.splice(+b.dataset.pdel, 1); render(); return; }
  if (b.dataset.t2) { const t = S.tasks.find(x => x.id === b.dataset.t2), i = +b.dataset.sn; if (t) { const n = nOf(t, S.today); setN(t.id, S.today, setsOf(t) > 1 ? (i <= n ? i - 1 : i) : i); } return; }
  if (b.dataset.t) { toggle(b.dataset.t, b.dataset.d); return; }
  if (b.dataset.wk !== undefined) { const n = +b.dataset.wk; weekStart = n === 0 ? mondayOf(S.today) : addDays(weekStart, 7 * n); render(); return; }
  if (b.dataset.reload) { load(false); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && TOKEN) { q = q.then(() => load(false)); } });
// 시작: 저장해 둔 오늘 화면이 있으면 바로 보여 주고, 최신 내용은 뒤에서 받아요
(function boot() {
  if (!TOKEN) { loading = false; render(); return; }
  const c = cacheLoad(); if (c) { applyView(c, true); loading = false; render(); }
  load(true);
})();

if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => { /* 없어도 동작해요 */ }); }); }
